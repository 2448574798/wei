<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sunwin Agent</title>
    <link rel="icon" href="./favicon.svg?v=20260605-1" type="image/svg+xml" />
    <link rel="shortcut icon" href="./favicon.svg?v=20260605-1" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg?v=20260605-1" />
    <link rel="stylesheet" href="./styles.css?v=20260605-1" />
</head>
<body>
    <main class="app">
        <section class="chat-shell">
            <header class="topbar">
                <div class="brand">
                    <div class="logo">sunw</div>
                    <div class="brand-copy">
                        <h1>Sunwin Agent</h1>
                        <p>一个更适合真实工作流的智能助手</p>
                    </div>
                </div>

                <div class="toolbar">
                    <button id="localExecBtn" class="mode-switch" type="button" aria-pressed="false" aria-label="本地执行模式">
                        <span class="mode-switch-label">本地执行</span>
                        <span class="mode-switch-track" aria-hidden="true">
                            <span class="mode-switch-thumb"></span>
                        </span>
                    </button>
                    <button id="logoutBtn" class="toolbar-btn subtle" type="button">退出</button>
                    <button id="themeBtn" class="toolbar-btn subtle" type="button">主题</button>
                    <button id="clearBtn" class="toolbar-btn subtle" type="button">新会话</button>
                </div>
            </header>

            <div class="messages" id="messages">
                <div class="empty" id="emptyState">
                    <h2>需要我为你做点什么？</h2>
                    <p>你可以直接提问，也可以让我联网思考、执行本地任务，或者帮你继续完成后续动作。</p>
                </div>
            </div>

            <footer class="composer">
                <div class="input-box">
                    <textarea id="prompt" rows="1" placeholder="说说你的想法"></textarea>
                    <button class="send-btn" id="sendBtn" title="发送" aria-label="发送">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M12 19V7" />
                            <path d="M7.5 11.5L12 7l4.5 4.5" />
                        </svg>
                    </button>
                </div>

                <div class="composer-footer">
                    <div class="status-line" id="statusLine">
                        <span class="status-dot"></span>
                        <span id="statusText">已准备就绪</span>
                    </div>
                    <div><span id="charCount">0</span> 字</div>
                </div>
            </footer>
        </section>
    </main>

    <script src="./app.js?v=20260605-1"></script>
</body>
</html>
