<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>登录 · Sunwin Agent</title>
    <link rel="icon" href="./favicon.svg?v=20260604-1" type="image/svg+xml" />
    <style>
        :root {
            --bg: #eef6ff;
            --bg-accent: #dfeefe;
            --panel: rgba(250, 253, 255, 0.9);
            --text: #162033;
            --muted: #64748b;
            --border: rgba(125, 164, 214, 0.26);
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --danger: #dc2626;
            --shadow: 0 24px 60px rgba(37, 99, 235, 0.12);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 28%),
                radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.15), transparent 26%),
                linear-gradient(160deg, var(--bg) 0%, var(--bg-accent) 100%);
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .card {
            width: min(420px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            border-radius: 28px;
            padding: 28px;
            backdrop-filter: blur(16px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .logo {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitle {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        form {
            display: grid;
            gap: 14px;
            margin-top: 20px;
        }

        label {
            display: grid;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            min-height: 48px;
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 0 14px;
            background: rgba(255, 255, 255, 0.88);
            color: var(--text);
            outline: none;
        }

        input:focus {
            border-color: rgba(37, 99, 235, 0.4);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
        }

        button {
            min-height: 50px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .hint {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        .error {
            min-height: 20px;
            color: var(--danger);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <section class="card">
        <div class="brand">
            <div class="logo">sunw</div>
            <div>
                <h1>Sunwin Agent</h1>
                <p class="subtitle">登录后继续使用你的智能工作流</p>
            </div>
        </div>

        <p class="hint">当前版本先提供登录能力，后续可以在此基础上增加注册和用户专属 Worker 绑定。</p>

        <form id="loginForm">
            <label>
                用户名
                <input id="username" name="username" autocomplete="username" required />
            </label>
            <label>
                密码
                <input id="password" name="password" type="password" autocomplete="current-password" required />
            </label>
            <div class="error" id="errorText"></div>
            <button id="submitBtn" type="submit">登录</button>
        </form>
    </section>

    <script>
        const formEl = document.getElementById("loginForm");
        const usernameEl = document.getElementById("username");
        const passwordEl = document.getElementById("password");
        const submitBtnEl = document.getElementById("submitBtn");
        const errorTextEl = document.getElementById("errorText");

        const nextUrl = new URLSearchParams(window.location.search).get("next") || "/";

        async function checkExistingSession() {
            const response = await fetch("/api/auth/me", { credentials: "same-origin" });
            if (response.ok) {
                window.location.replace(nextUrl);
            }
        }

        formEl.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorTextEl.textContent = "";
            submitBtnEl.disabled = true;

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: usernameEl.value.trim(),
                        password: passwordEl.value,
                    }),
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.detail || "登录失败");
                }
                window.location.replace(nextUrl);
            } catch (error) {
                errorTextEl.textContent = error.message || "登录失败";
            } finally {
                submitBtnEl.disabled = false;
            }
        });

        checkExistingSession();
        usernameEl.focus();
    </script>
</body>
</html>
