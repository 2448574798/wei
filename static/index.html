<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sunwin Agent</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/favicon.svg" />
    <style>
        :root {
            --bg: #eef6ff;
            --bg-accent: #dfeefe;
            --panel: rgba(250, 253, 255, 0.86);
            --panel-solid: #fafdff;
            --text: #162033;
            --muted: #64748b;
            --border: rgba(125, 164, 214, 0.26);
            --primary: #2563eb;
            --primary-strong: #1d4ed8;
            --primary-soft: rgba(37, 99, 235, 0.10);
            --assistant: #f3f8fe;
            --assistant-border: #dce8f6;
            --user: linear-gradient(135deg, #2563eb, #38bdf8);
            --success: #15803d;
            --warning: #b45309;
            --danger: #dc2626;
            --shadow: 0 24px 60px rgba(37, 99, 235, 0.12);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        [data-theme="dark"] {
            --bg: #10151c;
            --bg-accent: #1b2430;
            --panel: rgba(18, 24, 32, 0.84);
            --panel-solid: #141b24;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.18);
            --primary: #60a5fa;
            --primary-strong: #93c5fd;
            --primary-soft: rgba(96, 165, 250, 0.12);
            --assistant: #18212c;
            --assistant-border: #243243;
            --user: linear-gradient(135deg, #2563eb, #38bdf8);
            --shadow: 0 28px 70px rgba(0, 0, 0, 0.34);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(59, 130, 246, 0.18), transparent 28%),
                radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.15), transparent 26%),
                linear-gradient(160deg, var(--bg) 0%, var(--bg-accent) 100%);
            padding: 18px;
        }

        button,
        select,
        textarea {
            font: inherit;
        }

        .app {
            width: min(1080px, 100%);
            height: calc(100vh - 36px);
            margin: 0 auto;
            display: flex;
        }

        .chat-shell {
            flex: 1;
            min-height: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
            border-radius: var(--radius-xl);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            overflow: hidden;
        }

        .topbar {
            padding: 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 800;
            letter-spacing: -0.04em;
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.24);
            flex: 0 0 auto;
        }

        .brand-copy {
            min-width: 0;
        }

        .brand-copy h1 {
            margin: 0;
            font-size: 20px;
            line-height: 1.15;
        }

        .brand-copy p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .toolbar {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            min-height: 46px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--panel-solid);
            color: var(--text);
            padding: 0 16px;
            cursor: pointer;
            transition: 0.16s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
        }

        .toolbar-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(37, 99, 235, 0.32);
            background: var(--primary-soft);
        }

        .toolbar-btn.subtle {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.82), rgba(242, 248, 255, 0.98));
        }

        [data-theme="dark"] .toolbar-btn.subtle {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.82), rgba(20, 27, 36, 0.96));
        }

        .model-picker {
            position: relative;
        }

        .model-select {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
        }

        .model-trigger {
            min-height: 58px;
            min-width: 278px;
            border-radius: 22px;
            border: 1px solid rgba(37, 99, 235, 0.14);
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.82), rgba(239, 248, 255, 0.98)),
                var(--panel-solid);
            color: var(--text);
            padding: 10px 14px 10px 16px;
            cursor: pointer;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: 0.18s ease;
        }

        [data-theme="dark"] .model-trigger {
            background:
                linear-gradient(135deg, rgba(30, 41, 59, 0.88), rgba(20, 27, 36, 0.96)),
                var(--panel-solid);
            border-color: rgba(96, 165, 250, 0.18);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .model-trigger:hover,
        .model-picker.open .model-trigger {
            transform: translateY(-1px);
            border-color: rgba(37, 99, 235, 0.30);
            box-shadow:
                0 12px 28px rgba(37, 99, 235, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.42);
        }

        .model-copy {
            min-width: 0;
            display: grid;
            gap: 3px;
            text-align: left;
        }

        .model-eyebrow {
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 800;
        }

        .model-main {
            font-weight: 800;
            font-size: 15px;
            line-height: 1.15;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .model-sub {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .model-arrow {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(37, 99, 235, 0.08);
            color: var(--primary-strong);
            font-size: 14px;
            transition: transform 0.18s ease;
        }

        .model-picker.open .model-arrow {
            transform: rotate(180deg);
        }

        .model-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            width: 320px;
            padding: 10px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: rgba(255, 251, 245, 0.96);
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 60px rgba(71, 55, 36, 0.18);
            display: none;
            gap: 8px;
            z-index: 20;
        }

        [data-theme="dark"] .model-menu {
            background: rgba(20, 27, 36, 0.96);
            box-shadow: 0 28px 64px rgba(0, 0, 0, 0.4);
        }

        .model-picker.open .model-menu {
            display: grid;
        }

        .model-option {
            width: 100%;
            border: 1px solid transparent;
            border-radius: 18px;
            background: transparent;
            color: var(--text);
            padding: 12px 13px;
            cursor: pointer;
            text-align: left;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            transition: 0.16s ease;
        }

        .model-option:hover,
        .model-option.active {
            border-color: rgba(37, 99, 235, 0.18);
            background: var(--primary-soft);
        }

        .model-option-copy {
            min-width: 0;
            display: grid;
            gap: 4px;
        }

        .model-option-name {
            font-size: 14px;
            font-weight: 800;
        }

        .model-option-desc {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }

        .model-option-badge {
            border-radius: 999px;
            padding: 5px 9px;
            background: rgba(37, 99, 235, 0.08);
            color: var(--primary-strong);
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .messages {
            min-height: 0;
            overflow-y: auto;
            padding: 20px 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        .empty {
            margin: auto;
            max-width: 580px;
            text-align: center;
            color: var(--muted);
            padding: 32px 18px;
        }

        .empty h2 {
            margin: 0;
            color: var(--text);
            font-size: clamp(28px, 5vw, 42px);
            line-height: 1.08;
        }

        .empty p {
            margin: 12px 0 0;
            line-height: 1.7;
        }

        .message {
            max-width: min(62%, 520px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: rise 0.18s ease;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bubble {
            border-radius: 24px;
            padding: 9px 11px;
            font-size: 13px;
            line-height: 1.55;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background: var(--user);
            color: #fff;
            border-bottom-right-radius: 8px;
        }

        .message.assistant .bubble {
            background: var(--assistant);
            border: 1px solid var(--assistant-border);
            border-bottom-left-radius: 8px;
        }

        .message-meta {
            color: var(--muted);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 0 4px;
        }

        .copy-btn {
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            padding: 0;
            font-size: 12px;
        }

        .copy-btn:hover {
            color: var(--primary);
        }

        .trace-stack {
            display: grid;
            gap: 10px;
        }

        .trace-card {
            background: var(--panel-solid);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
        }

        .trace-card summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 700;
        }

        .trace-card summary::-webkit-details-marker {
            display: none;
        }

        .trace-card[open] summary {
            border-bottom: 1px solid var(--border);
            background: var(--primary-soft);
        }

        .trace-labels {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .trace-tag {
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .trace-tag.route-research,
        .trace-tag.trace {
            background: rgba(37, 99, 235, 0.10);
            color: #1d4ed8;
        }

        .trace-tag.route-agent {
            background: rgba(14, 165, 233, 0.10);
            color: #0369a1;
        }

        .trace-tag.action {
            background: rgba(96, 165, 250, 0.12);
            color: var(--primary-strong);
        }

        [data-theme="dark"] .trace-tag.route-research,
        [data-theme="dark"] .trace-tag.trace {
            color: #7dd3fc;
        }

        [data-theme="dark"] .trace-tag.route-agent {
            color: #7dd3fc;
        }

        [data-theme="dark"] .trace-tag.action {
            color: #bfdbfe;
        }

        .trace-content {
            padding: 14px;
            display: grid;
            gap: 12px;
        }

        .kv-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .kv {
            background: rgba(148, 163, 184, 0.06);
            border-radius: 14px;
            padding: 10px 12px;
        }

        .kv strong {
            display: block;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .trace-pre {
            margin: 0;
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .composer {
            padding: 14px;
            border-top: 1px solid var(--border);
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 10px 12px;
            background: var(--panel-solid);
            border: 1px solid var(--border);
            border-radius: 24px;
        }

        textarea {
            flex: 1;
            min-width: 0;
            min-height: 44px;
            max-height: 180px;
            resize: none;
            border: none;
            background: transparent;
            outline: none;
            color: var(--text);
            line-height: 1.55;
            padding: 10px 2px;
        }

        textarea::placeholder {
            color: var(--muted);
        }

        .send-btn {
            width: 46px;
            height: 46px;
            min-width: 46px;
            border: none;
            border-radius: 50%;
            background: var(--user);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 12px 22px rgba(37, 99, 235, 0.24);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        .composer-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 4px 2px;
            color: var(--muted);
            font-size: 12px;
            flex-wrap: wrap;
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .loading-bubble {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .dots {
            display: inline-flex;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: pulse 1s infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: 0.14s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.28s;
        }

        @keyframes pulse {
            0%, 80%, 100% {
                opacity: 0.36;
                transform: scale(0.7);
            }
            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        pre code,
        code {
            font-family: var(--mono);
        }

        .bubble pre {
            margin: 10px 0;
            padding: 12px;
            border-radius: 16px;
            overflow-x: auto;
            background: rgba(15, 23, 42, 0.92);
            color: #e5e7eb;
            white-space: pre;
        }

        .messages {
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.45) transparent;
        }

        @media (max-width: 1080px) {
            body {
                padding: 12px;
            }

            .app {
                width: 100%;
                height: calc(100vh - 24px);
                min-height: calc(100vh - 24px);
            }

            .chat-shell {
                min-height: 100%;
            }
        }

        @media (max-width: 720px) {
            body {
                padding: 0;
            }

            .app {
                height: 100vh;
                min-height: 100vh;
            }

            .chat-shell {
                border-radius: 0;
            }

            .topbar {
                padding: 14px;
            }

            .toolbar {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .model-picker {
                grid-column: 1 / -1;
            }

            .model-trigger {
                width: 100%;
                min-width: 0;
                min-height: 56px;
            }

            .model-menu {
                left: 0;
                right: 0;
                width: 100%;
            }

            .toolbar-btn {
                width: 100%;
                justify-content: center;
            }

            .messages {
                padding: 14px 12px 8px;
            }

            .message {
                max-width: 82%;
            }

            .bubble {
                font-size: 12.5px;
                padding: 8px 10px;
            }

            .kv-grid {
                grid-template-columns: 1fr;
            }

            .composer {
                padding-bottom: max(14px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="chat-shell">
            <header class="topbar">
                <div class="brand">
                    <div class="logo">sunw</div>
                    <div class="brand-copy">
                        <h1>Sunwin Agent</h1>
                        <p>能看见规划和工具调用过程的工作流助手</p>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="model-picker" id="modelPicker">
                        <select id="modelSelect" class="model-select" aria-hidden="true" tabindex="-1">
                            <option value="gpt-4o-mini">GPT-4o-mini</option>
                            <option value="gpt-4o">GPT-4o</option>
                            <option value="gpt-5.4">GPT-5.4</option>
                            <option value="gpt-5.5">GPT-5.5</option>
                        </select>

                        <button id="modelTrigger" class="model-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                            <span class="model-copy">
                                <span class="model-eyebrow">当前模型</span>
                                <span class="model-main" id="modelCurrentName">GPT-4o-mini</span>
                                <span class="model-sub" id="modelCurrentDesc">更快更省，适合日常问答与轻量工作流</span>
                            </span>
                            <span class="model-arrow">⌄</span>
                        </button>

                        <div class="model-menu" id="modelMenu" role="listbox">
                            <button type="button" class="model-option" data-value="gpt-4o-mini">
                                <span class="model-option-copy">
                                    <span class="model-option-name">GPT-4o-mini</span>
                                    <span class="model-option-desc">轻量、快速、成本低，适合作为默认交互模型</span>
                                </span>
                                <span class="model-option-badge">轻快</span>
                            </button>
                            <button type="button" class="model-option" data-value="gpt-4o">
                                <span class="model-option-copy">
                                    <span class="model-option-name">GPT-4o</span>
                                    <span class="model-option-desc">更均衡，适合复杂一些的对话与工具协作</span>
                                </span>
                                <span class="model-option-badge">均衡</span>
                            </button>
                            <button type="button" class="model-option" data-value="gpt-5.4">
                                <span class="model-option-copy">
                                    <span class="model-option-name">GPT-5.4</span>
                                    <span class="model-option-desc">更强的综合能力，适合高质量回答和较复杂流程</span>
                                </span>
                                <span class="model-option-badge">进阶</span>
                            </button>
                            <button type="button" class="model-option" data-value="gpt-5.5">
                                <span class="model-option-copy">
                                    <span class="model-option-name">GPT-5.5</span>
                                    <span class="model-option-desc">更偏高性能场景，适合最重的推理和执行任务</span>
                                </span>
                                <span class="model-option-badge">高性能</span>
                            </button>
                        </div>
                    </div>
                    <button id="themeBtn" class="toolbar-btn subtle" type="button">主题</button>
                    <button id="clearBtn" class="toolbar-btn subtle" type="button">新会话</button>
                </div>
            </header>

            <div class="messages" id="messages">
                <div class="empty" id="emptyState">
                    <h2>今天想让它帮你做什么？</h2>
                    <p>你可以直接提问，也可以让它搜索、抓网页、总结，或者在拿到结果后继续执行动作。</p>
                </div>
            </div>

            <footer class="composer">
                <div class="input-box">
                    <textarea id="prompt" rows="1" placeholder="输入你的问题，回车发送，Shift + Enter 换行"></textarea>
                    <button class="send-btn" id="sendBtn" title="发送">↑</button>
                </div>

                <div class="composer-footer">
                    <div class="status-line" id="statusLine">
                        <span class="status-dot"></span>
                        <span id="statusText">已连接，默认返回 planner 与 tool trace</span>
                    </div>
                    <div><span id="charCount">0</span> 字</div>
                </div>
            </footer>
        </section>
    </main>

    <script>
        const messagesEl = document.getElementById("messages");
        const emptyStateEl = document.getElementById("emptyState");
        const promptEl = document.getElementById("prompt");
        const sendBtnEl = document.getElementById("sendBtn");
        const clearBtnEl = document.getElementById("clearBtn");
        const themeBtnEl = document.getElementById("themeBtn");
        const modelSelectEl = document.getElementById("modelSelect");
        const modelPickerEl = document.getElementById("modelPicker");
        const modelTriggerEl = document.getElementById("modelTrigger");
        const modelMenuEl = document.getElementById("modelMenu");
        const modelCurrentNameEl = document.getElementById("modelCurrentName");
        const modelCurrentDescEl = document.getElementById("modelCurrentDesc");
        const statusTextEl = document.getElementById("statusText");
        const statusLineEl = document.getElementById("statusLine");
        const charCountEl = document.getElementById("charCount");

        const STORAGE_KEY = "sunwin_messages_v4";
        const MODEL_KEY = "sunwin_model_v4";
        const THEME_KEY = "sunwin_theme_v4";
        const THREAD_KEY = "sunwin_thread_v4";

        let chatHistory = [];
        let isSending = false;

        function setViewportHeight() {
            document.documentElement.style.setProperty("--vh", `${window.innerHeight * 0.01}px`);
        }

        function nowTime() {
            return new Date().toLocaleTimeString("zh-CN", {
                hour: "2-digit",
                minute: "2-digit",
            });
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function renderMarkdownLite(text) {
            let html = escapeHtml(text || "");

            html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
            html = html.replace(/`([^`]+)`/g, "<code>$1</code>");

            return html
                .split(/\n{2,}/)
                .map((block) => {
                    const trimmed = block.trim();
                    if (!trimmed) return "";
                    if (trimmed.startsWith("<pre>")) return trimmed;
                    return `<p>${trimmed.replace(/\n/g, "<br>")}</p>`;
                })
                .join("");
        }

        function getThreadId() {
            return localStorage.getItem(THREAD_KEY) || "";
        }

        function setThreadId(threadId) {
            if (threadId) {
                localStorage.setItem(THREAD_KEY, threadId);
            }
        }

        function clearThreadId() {
            localStorage.removeItem(THREAD_KEY);
        }

        function updateEmptyState() {
            emptyStateEl.style.display = chatHistory.length ? "none" : "block";
        }

        function resizeInput() {
            promptEl.style.height = "auto";
            promptEl.style.height = `${Math.min(promptEl.scrollHeight, 180)}px`;
            charCountEl.textContent = String(promptEl.value.length);
        }

        function setStatus(text, type = "ok") {
            statusTextEl.textContent = text;
            const dot = statusLineEl.querySelector(".status-dot");
            dot.style.background = type === "error" ? "var(--danger)" : type === "warn" ? "var(--warning)" : "var(--success)";
        }

        function plannerLabel(route) {
            if (route === "research") return "调研";
            if (route === "agent") return "执行";
            return "未知";
        }

        function getModelMeta(value) {
            const map = {
                "gpt-4o-mini": {
                    name: "GPT-4o-mini",
                    desc: "更快更省，适合日常问答与轻量工作流",
                },
                "gpt-4o": {
                    name: "GPT-4o",
                    desc: "更均衡，适合复杂一些的对话与工具协作",
                },
                "gpt-5.4": {
                    name: "GPT-5.4",
                    desc: "更强的综合能力，适合高质量回答和较复杂流程",
                },
                "gpt-5.5": {
                    name: "GPT-5.5",
                    desc: "更偏高性能场景，适合最重的推理和执行任务",
                },
            };
            return map[value] || { name: value, desc: "当前选择的模型" };
        }

        function syncModelPicker() {
            const meta = getModelMeta(modelSelectEl.value);
            modelCurrentNameEl.textContent = meta.name;
            modelCurrentDescEl.textContent = meta.desc;

            document.querySelectorAll(".model-option").forEach((button) => {
                button.classList.toggle("active", button.dataset.value === modelSelectEl.value);
            });
        }

        function closeModelPicker() {
            modelPickerEl.classList.remove("open");
            modelTriggerEl.setAttribute("aria-expanded", "false");
        }

        function setupModelPicker() {
            modelTriggerEl.addEventListener("click", (event) => {
                event.stopPropagation();
                const isOpen = modelPickerEl.classList.toggle("open");
                modelTriggerEl.setAttribute("aria-expanded", String(isOpen));
            });

            document.querySelectorAll(".model-option").forEach((button) => {
                button.addEventListener("click", (event) => {
                    event.stopPropagation();
                    modelSelectEl.value = button.dataset.value;
                    syncModelPicker();
                    persistState();
                    closeModelPicker();
                });
            });

            document.addEventListener("click", () => {
                closeModelPicker();
            });

            modelMenuEl.addEventListener("click", (event) => {
                event.stopPropagation();
            });
        }

        function answerModeLabel(mode) {
            if (mode === "grounded_summary") return "基于证据总结";
            if (mode === "tool_agent") return "工具执行";
            return "-";
        }

        function copyText(text, buttonEl) {
            navigator.clipboard.writeText(text).then(() => {
                const prev = buttonEl.textContent;
                buttonEl.textContent = "已复制";
                setTimeout(() => {
                    buttonEl.textContent = prev;
                }, 1200);
            });
        }

        function createTraceBlock(meta) {
            if (!meta || (!meta.plannerDecision && !meta.toolTrace?.length)) {
                return null;
            }

            const stack = document.createElement("div");
            stack.className = "trace-stack";

            if (meta.plannerDecision) {
                const planner = meta.plannerDecision;
                const card = document.createElement("details");
                card.className = "trace-card";

                const summary = document.createElement("summary");
                summary.innerHTML = `
                    <div class="trace-labels">
                        <span class="trace-tag route-${escapeHtml(planner.route || "unknown")}">${escapeHtml(plannerLabel(planner.route))}</span>
                        <span>规划决策</span>
                    </div>
                    <span>${escapeHtml(answerModeLabel(planner.answer_mode))}</span>
                `;

                const content = document.createElement("div");
                content.className = "trace-content";

                const actions = planner.post_actions?.length ? planner.post_actions.join(", ") : "无";
                content.innerHTML = `
                    <div class="kv-grid">
                        <div class="kv">
                            <strong>路由</strong>
                            <div>${escapeHtml(planner.route || "-")}</div>
                        </div>
                        <div class="kv">
                            <strong>模式</strong>
                            <div>${escapeHtml(planner.answer_mode || "-")}</div>
                        </div>
                        <div class="kv">
                            <strong>是否抓取网页</strong>
                            <div>${planner.needs_fetch ? "是" : "否"}</div>
                        </div>
                        <div class="kv">
                            <strong>后续动作</strong>
                            <div>${escapeHtml(actions)}</div>
                        </div>
                    </div>
                    <div class="kv">
                        <strong>原因</strong>
                        <div>${escapeHtml(planner.reason || "-")}</div>
                    </div>
                    <div class="kv">
                        <strong>搜索词</strong>
                        <pre class="trace-pre">${escapeHtml(planner.search_query || "-")}</pre>
                    </div>
                `;

                card.append(summary, content);
                stack.appendChild(card);
            }

            if (meta.toolTrace?.length) {
                const card = document.createElement("details");
                card.className = "trace-card";

                const summary = document.createElement("summary");
                summary.innerHTML = `
                    <div class="trace-labels">
                        <span class="trace-tag trace">${meta.toolTrace.length}</span>
                        <span>工具轨迹</span>
                    </div>
                    <span>展开查看</span>
                `;

                const content = document.createElement("div");
                content.className = "trace-content";

                meta.toolTrace.forEach((item, index) => {
                    const block = document.createElement("div");
                    block.className = "kv";
                    block.innerHTML = `
                        <strong>步骤 ${index + 1} · ${escapeHtml(item.tool || "tool")}</strong>
                        <pre class="trace-pre">${escapeHtml(item.content || "-")}</pre>
                    `;
                    content.appendChild(block);
                });

                card.append(summary, content);
                stack.appendChild(card);
            }

            return stack;
        }

        function addMessage(role, content, options = {}) {
            const { save = true, time = nowTime(), meta = null } = options;
            const wrapper = document.createElement("div");
            wrapper.className = `message ${role}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.innerHTML = renderMarkdownLite(content);

            const metaRow = document.createElement("div");
            metaRow.className = "message-meta";

            const timeEl = document.createElement("span");
            timeEl.textContent = time;

            const copyBtn = document.createElement("button");
            copyBtn.className = "copy-btn";
            copyBtn.type = "button";
            copyBtn.textContent = "复制";
            copyBtn.addEventListener("click", () => copyText(content, copyBtn));

            metaRow.append(timeEl, copyBtn);
            wrapper.append(bubble, metaRow);

            const traceBlock = createTraceBlock(meta);
            if (traceBlock) {
                wrapper.appendChild(traceBlock);
            }

            messagesEl.appendChild(wrapper);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            if (save) {
                chatHistory.push({ role, content, time, meta });
                persistState();
            }

            updateEmptyState();
            return wrapper;
        }

        function addLoadingMessage() {
            const wrapper = document.createElement("div");
            wrapper.className = "message assistant";
            wrapper.dataset.loading = "true";

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.innerHTML = `
                <span class="loading-bubble">
                    <span>思考中</span>
                    <span class="dots">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </span>
                </span>
            `;

            wrapper.appendChild(bubble);
            messagesEl.appendChild(wrapper);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return wrapper;
        }

        function persistState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
            localStorage.setItem(MODEL_KEY, modelSelectEl.value);
        }

        function loadState() {
            const savedModel = localStorage.getItem(MODEL_KEY);
            if (savedModel) {
                modelSelectEl.value = savedModel;
            }

            const savedTheme = localStorage.getItem(THEME_KEY);
            if (savedTheme === "dark") {
                document.documentElement.setAttribute("data-theme", "dark");
            }

            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                chatHistory = raw ? JSON.parse(raw) : [];
            } catch {
                chatHistory = [];
            }

            chatHistory.forEach((item) => addMessage(item.role, item.content, { save: false, time: item.time, meta: item.meta || null }));
            updateEmptyState();
        }

        async function sendMessage() {
            const userMessage = promptEl.value.trim();
            if (!userMessage || isSending) {
                return;
            }

            if (userMessage.length > 2000) {
                setStatus("消息过长，最多 2000 字符", "error");
                return;
            }

            isSending = true;
            sendBtnEl.disabled = true;
            setStatus("正在请求模型...");

            promptEl.value = "";
            resizeInput();
            addMessage("user", userMessage);

            const loadingEl = addLoadingMessage();

            try {
                const payload = {
                    model: modelSelectEl.value,
                    messages: [{ role: "user", content: userMessage }],
                    include_tool_trace: true,
                };

                const threadId = getThreadId();
                if (threadId) {
                    payload.thread_id = threadId;
                }

                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.detail || data.error || `HTTP ${response.status}`);
                }

                if (data.thread_id) {
                    setThreadId(data.thread_id);
                }

                loadingEl.remove();

                const meta = {
                    plannerDecision: data.planner_decision || null,
                    toolTrace: data.tool_trace || [],
                };

                addMessage("assistant", data.reply || "无回复", { meta });

                const route = data.planner_decision?.route;
                const traceCount = data.tool_trace?.length || 0;
                const statusSuffix = [route ? `路由：${plannerLabel(route)}` : "", traceCount ? `工具：${traceCount}` : ""]
                    .filter(Boolean)
                    .join(" · ");
                setStatus(statusSuffix ? `回答完成 · ${statusSuffix}` : "回答完成");
            } catch (error) {
                loadingEl.remove();
                const message = `请求失败：${error.message}`;
                addMessage("assistant", message);
                setStatus(message, "error");
            } finally {
                isSending = false;
                sendBtnEl.disabled = false;
                promptEl.focus();
            }
        }

        function clearConversation() {
            if (!window.confirm("确定要清空当前会话吗？这会开始一个新的会话线程。")) {
                return;
            }

            chatHistory = [];
            localStorage.removeItem(STORAGE_KEY);
            clearThreadId();

            [...messagesEl.children].forEach((node) => {
                if (node !== emptyStateEl) {
                    node.remove();
                }
            });

            updateEmptyState();
            setStatus("已清空会话，新的会话线程已就绪");
        }

        sendBtnEl.addEventListener("click", sendMessage);
        clearBtnEl.addEventListener("click", clearConversation);

        promptEl.addEventListener("input", resizeInput);
        promptEl.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        modelSelectEl.addEventListener("change", () => {
            persistState();
            syncModelPicker();
        });

        themeBtnEl.addEventListener("click", () => {
            const dark = document.documentElement.getAttribute("data-theme") === "dark";
            if (dark) {
                document.documentElement.removeAttribute("data-theme");
                localStorage.setItem(THEME_KEY, "light");
            } else {
                document.documentElement.setAttribute("data-theme", "dark");
                localStorage.setItem(THEME_KEY, "dark");
            }
        });

        setViewportHeight();
        window.addEventListener("resize", setViewportHeight);
        window.addEventListener("orientationchange", setViewportHeight);

        loadState();
        setupModelPicker();
        syncModelPicker();
        resizeInput();
        promptEl.focus();
    </script>
</body>
</html>
