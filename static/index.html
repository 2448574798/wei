<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sunwin Agent</title>
    <link rel="icon" href="./favicon.svg?v=20260601-2" type="image/svg+xml" />
    <link rel="shortcut icon" href="./favicon.svg?v=20260601-2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg?v=20260601-2" />
    <link rel="stylesheet" href="./styles.css?v=20260601-2" />
</head>
<body>
    <main class="app">
        <section class="chat-shell">
            <header class="topbar">
                <div class="brand">
                    <div class="logo">sunw</div>
                    <div class="brand-copy">
                        <h1>Sunwin Agent</h1>
                        <p>&#x4e00;&#x4e2a;&#x597d;&#x7528;&#x7684;&#x5de5;&#x4f5c;&#x6d41;&#x52a9;&#x624b;</p>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="model-picker" id="modelPicker">
                        <select id="modelSelect" class="model-select" aria-hidden="true" tabindex="-1">
                            <option value="gpt-4o-mini">GPT-4o-mini</option>
                            <option value="gpt-4o">GPT-4o</option>
                            <option value="gpt-5.4">GPT-5.4</option>
                            <option value="gpt-5.5">GPT-5.5</option>
                        </select>

                        <button id="modelTrigger" class="model-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                            <span class="model-copy">
                                <span class="model-eyebrow">&#x5f53;&#x524d;&#x6a21;&#x578b;</span>
                                <span class="model-main" id="modelCurrentName">GPT-4o-mini</span>
                                <span class="model-sub" id="modelCurrentDesc">&#x66f4;&#x5feb;&#x66f4;&#x7701;&#xff0c;&#x9002;&#x5408;&#x65e5;&#x5e38;&#x95ee;&#x7b54;&#x4e0e;&#x8f7b;&#x91cf;&#x5de5;&#x4f5c;&#x6d41;</span>
                            </span>
                            <span class="model-arrow">&#x2304;</span>
                        </button>

                        <div class="model-menu" id="modelMenu" role="listbox">
                            <button type="button" class="model-option" data-value="gpt-4o-mini">
                                <span class="model-option-copy">
                                    <span class="model-option-name">GPT-4o-mini</span>
                                    <span class="model-option-desc">&#x8f7b;&#x91cf;&#x3001;&#x5feb;&#x901f;&#x3001;&#x6210;&#x672c;&#x4f4e;&#xff0c;&#x9002;&#x5408;&#x4f5c;&#x4e3a;&#x9ed8;&#x8ba4;&#x4ea4;&#x4e92;&#x6a21;&#x578b;</span>
                                </span>
                                <span class="model-option-badge">&#x8f7b;&#x5feb;</span>
                            </button>
                            <button type="button" class="model-option" data-value="gpt-4o">
                                <span class="model-option-copy">
                                    <span class="model-option-name">GPT-4o</span>
                                    <span class="model-option-desc">&#x66f4;&#x5747;&#x8861;&#xff0c;&#x9002;&#x5408;&#x590d;&#x6742;&#x4e00;&#x4e9b;&#x7684;&#x5bf9;&#x8bdd;&#x4e0e;&#x5de5;&#x5177;&#x534f;&#x4f5c;</span>
                                </span>
                                <span class="model-option-badge">&#x5747;&#x8861;</span>
                            </button>
                            <button type="button" class="model-option" data-value="gpt-5.4">
                                <span class="model-option-copy">
                                    <span class="model-option-name">GPT-5.4</span>
                                    <span class="model-option-desc">&#x66f4;&#x5f3a;&#x7684;&#x7efc;&#x5408;&#x80fd;&#x529b;&#xff0c;&#x9002;&#x5408;&#x9ad8;&#x8d28;&#x91cf;&#x56de;&#x7b54;&#x548c;&#x8f83;&#x590d;&#x6742;&#x6d41;&#x7a0b;</span>
                                </span>
                                <span class="model-option-badge">&#x8fdb;&#x9636;</span>
                            </button>
                            <button type="button" class="model-option" data-value="gpt-5.5">
                                <span class="model-option-copy">
                                    <span class="model-option-name">GPT-5.5</span>
                                    <span class="model-option-desc">&#x66f4;&#x504f;&#x9ad8;&#x6027;&#x80fd;&#x573a;&#x666f;&#xff0c;&#x9002;&#x5408;&#x6700;&#x91cd;&#x7684;&#x63a8;&#x7406;&#x548c;&#x6267;&#x884c;&#x4efb;&#x52a1;</span>
                                </span>
                                <span class="model-option-badge">&#x9ad8;&#x6027;&#x80fd;</span>
                            </button>
                        </div>
                    </div>
                    <button id="themeBtn" class="toolbar-btn subtle" type="button">&#x4e3b;&#x9898;</button>
                    <button id="clearBtn" class="toolbar-btn subtle" type="button">&#x65b0;&#x4f1a;&#x8bdd;</button>
                </div>
            </header>

            <div class="messages" id="messages">
                <div class="empty" id="emptyState">
                    <h2>&#x9700;&#x8981;&#x6211;&#x4e3a;&#x4f60;&#x505a;&#x70b9;&#x4ec0;&#x4e48;&#xff1f;</h2>
                    <p>&#x4f60;&#x53ef;&#x4ee5;&#x76f4;&#x63a5;&#x63d0;&#x95ee;&#xff0c;&#x4e5f;&#x53ef;&#x4ee5;&#x8ba9;&#x5b83;&#x641c;&#x7d22;&#x3001;&#x603b;&#x7ed3;&#xff0c;&#x4e5f;&#x53ef;&#x4ee5;&#x5e2e;&#x4f60;&#x53d1;&#x9001;&#x90ae;&#x4ef6;&#x3002;</p>
                </div>
            </div>

            <footer class="composer">
                <div class="input-box">
                    <textarea id="prompt" rows="1" placeholder="&#x8f93;&#x5165;&#x4f60;&#x7684;&#x95ee;&#x9898;&#xff0c;&#x56de;&#x8f66;&#x53d1;&#x9001;&#xff0c;Shift + Enter &#x6362;&#x884c;"></textarea>
                    <button class="send-btn" id="sendBtn" title="&#x53d1;&#x9001;">&#x2197;</button>
                </div>

                <div class="composer-footer">
                    <div class="status-line" id="statusLine">
                        <span class="status-dot"></span>
                        <span id="statusText">&#x5df2;&#x8fde;&#x63a5;&#xff0c;&#x9ed8;&#x8ba4;&#x8fd4;&#x56de;&#x89c4;&#x5212;&#x4fe1;&#x606f;&#x4e0e;&#x5de5;&#x5177;&#x8f68;&#x8ff9;</span>
                    </div>
                    <div><span id="charCount">0</span> &#x5b57;</div>
                </div>
            </footer>
        </section>
    </main>

    <script src="./app.js?v=20260601-2"></script>
</body>
</html>
